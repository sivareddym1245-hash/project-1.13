<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doc Decoder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Doc Decoder</h1>
        <p>Paste confusing technical documentation below to get a 5th-grade explanation and a real-world analogy.</p>
        
        <textarea id="docInput" placeholder="Paste documentation here..."></textarea>
        <button id="simplifyBtn">Simplify It</button>
        
        <div id="loading" class="hidden">Decoding... please wait.</div>
        <div id="resultBox" class="hidden"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
